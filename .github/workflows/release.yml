name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 1.0.0). Creates tag v<version> if missing."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            RAW="${RAW#v}"
            TAG="v${RAW}"
          else
            TAG="${GITHUB_REF_NAME}"
            RAW="${TAG#v}"
          fi
          if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-].+)?$ ]]; then
            echo "Invalid version: $RAW"
            exit 1
          fi
          # versionCode: major*10000 + minor*100 + patch (patch truncated to 2 digits)
          IFS='.' read -r MAJOR MINOR PATCH_REST <<< "${RAW%%[-+]*}"
          PATCH="${PATCH_REST:-0}"
          PATCH="${PATCH%%[!0-9]*}"
          PATCH="${PATCH:-0}"
          CODE=$((MAJOR * 10000 + MINOR * 100 + (PATCH % 100)))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$RAW" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG name=$RAW code=$CODE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Prepare artifact
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          SRC=$(ls composeApp/build/outputs/apk/release/*.apk | head -n 1)
          DEST="dist/TriDot-PnP-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TriDot-PnP ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: dist/TriDot-PnP-*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
